<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airport Route Checker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:#0b1220;
    color:#e8eef7;
}

body{
    overflow:hidden;
}

.app{
    display:flex;
    flex-direction:column;
    width:100%;
    height:100vh;
}

/* HEADER */

.header{
    height:68px;
    min-height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:#101a2b;
    border-bottom:1px solid #26354a;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
    z-index:1000;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-icon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#12345d;
    color:#63a4ff;
    font-size:20px;
}

h1{
    margin:0;
    font-size:19px;
    font-weight:650;
    letter-spacing:.2px;
}

.subtitle{
    margin-top:3px;
    color:#8494aa;
    font-size:11px;
}

.status{
    padding:8px 13px;
    border:1px solid #27533e;
    border-radius:20px;
    background:#10251d;
    color:#5ee09a;
    font-size:11px;
    font-weight:650;
    letter-spacing:.5px;
}

/* MAIN WORKSPACE */

.workspace{
    position:relative;
    width:100%;
    height:calc(100vh - 68px);
    min-height:0;
    overflow:hidden;
}

.controls{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:12px 20px;
    background:rgba(15,25,41,.94);
    border-bottom:1px solid #26354a;
    box-shadow:0 3px 15px rgba(0,0,0,.25);
}

#map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#111c2c;
}

/* AIRPORT INFORMATION */

.map-info{
    position:absolute;
    left:20px;
    bottom:20px;
    width:min(620px,calc(100% - 40px));
    max-height:190px;
    overflow:auto;
    z-index:800;
    padding:15px 17px;
    background:rgba(17,28,44,.96);
    border:1px solid #34475f;
    border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.38);
    backdrop-filter:blur(8px);
}

.info-title{
    margin-bottom:10px;
}

.airport-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.airport-row{
    padding:10px 12px;
}

.route-distance{
    padding:8px 12px;
}

.airport-placeholder{
    padding:14px;
}

/* Keep the map above the controls visually */
.leaflet-container{
    z-index:1;
}

/* LEAFLET */

.leaflet-control-zoom a{
    background:#111c2c !important;
    color:#d7e0eb !important;
    border-color:#304258 !important;
}

.leaflet-control-attribution{
    background:rgba(11,18,32,.85) !important;
    color:#718198 !important;
}

.leaflet-control-attribution a{
    color:#719bd1 !important;
}

.airport-marker{
    width:14px;
    height:14px;
    border:3px solid #fff;
    border-radius:50%;
    background:#247cf0;
    box-shadow:0 0 0 3px rgba(36,124,240,.28);
}

.airport-label{
    background:#101a2b !important;
    border:1px solid #34485f !important;
    color:#e6edf5 !important;
    padding:3px 6px !important;
    border-radius:4px !important;
    font-size:10px !important;
    font-weight:700 !important;
    box-shadow:0 2px 8px rgba(0,0,0,.3) !important;
}

.map-label{
    background:transparent !important;
    border:0 !important;
    box-shadow:none !important;
    color:#8fa1b7 !important;
    font-size:10px !important;
    font-weight:600 !important;
}

/* RESPONSIVE */

@media(max-width:800px){
    .header{
        padding:0 14px;
    }

    .controls{
        padding:10px;
    }

    .control-row{
        flex-wrap:wrap;
    }

    .control{
        min-width:130px;
    }

    #speed{
        max-width:none;
    }

    .check-btn,
    .clear-btn{
        flex:1;
    }

    .bottom-panel{
        grid-template-columns:1fr;
        padding:10px;
    }

    .airport-info{
        grid-template-columns:1fr;
    }
}
</style>

<style>
/* FINAL ROUTE MAP LAYOUT */

html, body {
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

.workspace {
    position:relative !important;
    width:100% !important;
    height:calc(100vh - 68px) !important;
    min-height:0 !important;
    overflow:hidden !important;
}

.workspace > #map {
    position:absolute !important;
    top:0 !important;
    left:0 !important;
    right:0 !important;
    bottom:0 !important;
    width:100% !important;
    height:100% !important;
    min-height:0 !important;
    z-index:1 !important;
}

.workspace > .controls {
    position:absolute !important;
    top:0 !important;
    left:0 !important;
    right:0 !important;
    z-index:1000 !important;
}

.workspace > .map-info {
    position:absolute !important;
    left:20px !important;
    bottom:20px !important;
    width:620px !important;
    max-width:calc(100% - 40px) !important;
    max-height:180px !important;
    overflow:auto !important;
    z-index:1000 !important;
}

@media (max-width:800px) {
    .workspace > .map-info {
        left:10px !important;
        bottom:10px !important;
        width:calc(100% - 20px) !important;
    }
}
</style>


<style>
/* COMPACT ROUTE CONTROLS */

.workspace > .controls {
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    padding: 8px 16px !important;
    height: 62px !important;
    min-height: 62px !important;
}

.controls-title {
    display: none !important;
}

.mode-row {
    display: none !important;
}

.control-row {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    flex-wrap: nowrap !important;
    gap: 8px !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
}

.control {
    flex: 0 0 auto !important;
}

.control input {
    height: 38px !important;
    width: 150px !important;
    padding: 0 11px !important;
    font-size: 13px !important;
}

    width: 100px !important;
    max-width: 100px !important;
}

.check-btn,
.clear-btn {
    height: 38px !important;
    padding: 0 14px !important;
    white-space: nowrap !important;
}

.workspace > .controls .error {
    position: absolute !important;
    top: 62px !important;
    left: 16px !important;
    margin: 0 !important;
}

/* MAP */

.workspace > #map {
    top: 0 !important;
    height: 100% !important;
}

/* SMALL AIRPORT INFORMATION CARD */

.workspace > .map-info {
    left: 16px !important;
    bottom: 16px !important;
    width: 520px !important;
    max-width: calc(100% - 32px) !important;
    max-height: 125px !important;
    min-height: 0 !important;
    padding: 11px 14px !important;
    border-radius: 8px !important;
}

.workspace > .map-info .info-title {
    margin-bottom: 7px !important;
    font-size: 9px !important;
}

.airport-info {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 7px !important;
}

.airport-row {
    padding: 7px 9px !important;
}

.airport-type {
    margin-bottom: 2px !important;
    font-size: 8px !important;
}

.airport-details {
    font-size: 10px !important;
    line-height: 1.3 !important;
}

.airport-details strong {
    font-size: 12px !important;
}

.airport-placeholder {
    padding: 8px !important;
    font-size: 10px !important;
}

.route-distance {
    padding: 5px 8px !important;
    font-size: 10px !important;
}

.route-distance strong {
    font-size: 11px !important;
}

/* MOBILE */

@media (max-width: 700px) {
    .workspace > .controls {
        height: 108px !important;
        min-height: 108px !important;
    }

    .control-row {
        flex-wrap: wrap !important;
    }

    .control input {
        width: 120px !important;
    }

    .workspace > .map-info {
        width: calc(100% - 20px) !important;
        left: 10px !important;
        bottom: 10px !important;
    }
}
</style>

</head>

<body>
<header class="header">
    <div class="brand">
        <div class="brand-icon">✈</div>
        <div>
            <h1>Airport Route Checker</h1>
            <p>Flight Route • Jamming • Spoofing Investigation</p>
        </div>
    </div>
    <div class="status">● ROUTE CHECKER READY</div>
</header>

<div class="workspace">
    <div id="map"></div>

    <div class="controls">
        <div class="controls-title">Route Check</div>
        <div class="mode-row">
        </div>
        <div class="control-row">
            <div class="control"><input id="from" value="COK" placeholder="FROM: IATA / ICAO"></div>
            <div class="control"><input id="to" value="RUH" placeholder="TO: IATA / ICAO"></div>

            <button class="check-btn" onclick="checkRoute()">CHECK ROUTE</button>
            <button class="clear-btn" onclick="clearRoute()">CLEAR ROUTE</button>
        </div>
        <div id="error" class="error"></div>
    </div>

    <div class="map-info">
        <div class="info-title">Airport Information</div>

        <div class="airport-info" id="airportInfo">
            <div class="airport-placeholder">
                Select FROM and TO airports, then click <strong>CHECK ROUTE</strong>.
            </div>
        </div>
    </div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

<script>
let airports=[],gpsjam=[],firs=[],easaCodes=[],countries=[];
let gpsjamByHex=new Map();
let map,worldLayer,worldLabelLayer,routeLayer,markerLayer;
let currentEmail="";
let currentMode="history";

let liveTimer=null;
let liveLastUpdated=null;

const DATA={
    airports:"data/airports.json",
    firs:"data/firs.geojson",
    easa:"data/easa-spoofing.json",
    countries:"data/countries.geojson"
};

async function loadData(){
    try{
        const [a,f,e,c]=await Promise.all([
            fetch(DATA.airports),fetch(DATA.firs),
            fetch(DATA.easa),fetch(DATA.countries)
        ]);

        if(!a.ok)throw new Error("Could not load airports.json");
        if(!f.ok)throw new Error("Could not load FIR data");
        if(!e.ok)throw new Error("Could not load EASA data");
        if(!c.ok)throw new Error("Could not load countries.geojson");

        airports=await a.json();
        firs=await f.json();
        easaCodes=await e.json();
        countries=await c.json();

        initializeMap();
    }catch(err){
        console.error(err);
        showError("Data loading failed: "+err.message);
        document.querySelector(".status").textContent="● DATA ERROR";
    }
}


function initializeMap(){
    map=L.map("map",{
        minZoom:2,maxZoom:8,worldCopyJump:false,
        maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1,
        zoomControl:true
    });

    map.createPane("worldPane");
    map.getPane("worldPane").style.zIndex=200;

    map.createPane("gpsPane");
    map.getPane("gpsPane").style.zIndex=400;

    map.createPane("routePane");
    map.getPane("routePane").style.zIndex=500;

    map.createPane("markerPane");
    map.getPane("markerPane").style.zIndex=600;

    map.createPane("labelPane");
    map.getPane("labelPane").style.zIndex=650;

    map.setView([20,50],3);

    /*
     * Local Natural Earth country boundaries.
     * EASA FIR polygons are intentionally NOT drawn globally.
     * They are only used to classify the selected route.
     * This prevents airspace boundaries from appearing as
     * large purple shapes over the map.
     */
    worldLayer=L.geoJSON(countries,{
        pane:"worldPane",
        style:()=>({
            color:"#52657a",
            weight:1,
            opacity:1,
            fillColor:"#172536",
            fillOpacity:1
        }),
        onEachFeature:(feature,layer)=>{
            const p=feature.properties||{};
            const name=p.NAME||p.ADMIN||p.NAME_LONG||p.name||"";
            if(name)layer.bindTooltip(name,{
                sticky:true,direction:"top",className:"map-label"
            });
        }
    }).addTo(map);

    // Create all overlay groups BEFORE drawing any data.
    // Permanent country names for a more presentable aviation-style map.
    // Labels are separate from the country polygons and disappear when zoomed out too far.
    worldLabelLayer=L.layerGroup().addTo(map);

    countries.features.forEach(feature=>{
        const p=feature.properties||{};
        const name=p.NAME||p.ADMIN||p.NAME_LONG||p.name||"";
        if(!name)return;

        try{
            const temp=L.geoJSON(feature);
            const center=temp.getBounds().getCenter();

            L.marker(center,{
                interactive:false,
                icon:L.divIcon({
                    className:"country-name",
                    html:escapeHtml(name),
                    iconSize:null,
                    iconAnchor:[0,0]
                })
            }).addTo(worldLabelLayer);
        }catch(err){}
    });

    routeLayer=L.layerGroup().addTo(map);
    markerLayer=L.layerGroup().addTo(map);

    map.on("zoomend",updateCountryLabels);
    updateCountryLabels();

    // Airports are intentionally NOT drawn globally.
    // Only FROM and TO airports are displayed after route analysis.
    // Do not load a hard-coded historical dataset here.

    setTimeout(()=>{
        map.invalidateSize(true);
        console.log("World features:", worldLayer.getLayers().length);
    },200);
}

function drawBlueRouteOnly(from,to){
    routeLayer.clearLayers();
    const a=[airportLat(from),airportLon(from)];
    const b=[airportLat(to),airportLon(to)];
    L.polyline([a,b],{
        pane:"routePane",color:"#1261c9",weight:5,opacity:1,interactive:false
    }).addTo(routeLayer);
    markerLayer.clearLayers();
    addAirportMarker(from);
    addAirportMarker(to);
}

function clearRoute(){
    if(routeLayer)routeLayer.clearLayers();
    if(markerLayer)markerLayer.clearLayers();

    const result=document.getElementById("routeResult");
    if(result){
        result.innerHTML='Select FROM and TO airports, then click <strong>CHECK ROUTE</strong>.';
        result.dataset.routeChecked="false";
    }

    const error=document.getElementById("error");
    if(error)error.innerHTML="";

    const status=document.querySelector(".status");
    if(status)status.textContent="● ROUTE CHECKER READY";
}

function updateCountryLabels(){
    if(!worldLabelLayer || !map)return;

    const zoom=map.getZoom();

    worldLabelLayer.eachLayer(layer=>{
        const el=layer.getElement();
        if(!el)return;

        // Keep the world view clean; show names from zoom 3 onward.
        el.style.display=zoom>=3?"block":"none";
        el.style.fontSize=zoom>=5?"10px":"9px";
    });
}

function findAirport(value){
    const s=String(value||"").trim().toUpperCase();
    return airports.find(a=>{
        const iata=String(a.iata_code||a.iata||"").trim().toUpperCase();
        const icao=String(a.ident||a.icao_code||a.icao||"").trim().toUpperCase();
        return iata===s||icao===s;
    })||null;
}

function airportLat(a){return Number(a.latitude_deg??a.latitude??a.lat)}
function airportLon(a){return Number(a.longitude_deg??a.longitude??a.lon??a.lng)}
function airportName(a){return a.name||a.airport_name||a.ident||"Airport"}
function airportCode(a){return a.iata_code||a.iata||a.ident||a.icao_code||a.icao||""}


function checkRoute(){
    clearError();

    const from=findAirport(document.getElementById("from").value);
    const to=findAirport(document.getElementById("to").value);

    if(!from){
        showError("Origin airport not found.");
        return;
    }

    if(!to){
        showError("Destination airport not found.");
        return;
    }

    analyzeRoute(from,to);
}

function analyzeRoute(from,to){
    routeLayer.clearLayers();
    markerLayer.clearLayers();

    const fromLat=airportLat(from);
    const fromLon=airportLon(from);
    const toLat=airportLat(to);
    const toLon=airportLon(to);

    const route=turf.lineString([
        [fromLon,fromLat],
        [toLon,toLat]
    ]);

    const distanceKm=turf.length(route,{units:"kilometers"});

    // Draw the airport-to-airport route.
    L.polyline(
        [[fromLat,fromLon],[toLat,toLon]],
        {
            pane:"routePane",
            color:"#2488ff",
            weight:5,
            opacity:1,
            interactive:false
        }
    ).addTo(routeLayer);

    addAirportMarker(from);
    addAirportMarker(to);

    map.fitBounds(
        [[fromLat,fromLon],[toLat,toLon]],
        {padding:[80,80],maxZoom:6}
    );

    updateResult(from,to,distanceKm);

    document.querySelector(".status").textContent="● ROUTE READY";

    setTimeout(()=>map.invalidateSize(true),250);
}

function escapeHtml(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/\"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function addAirportMarker(airport){

    const code=airportCode(airport);

    const city=
        airport.municipality ||
        airport.city ||
        airport.locality ||
        "";

    const country=
        airport.iso_country ||
        airport.country_code ||
        "";

    const name=airportName(airport);

    const label =
        code +
        (city ? " • " + city : "");

    const icon=L.divIcon({
        className:"",
        html:'<div class="airport-marker"></div>',
        iconSize:[14,14],
        iconAnchor:[7,7]
    });

    const marker=L.marker(
        [airportLat(airport),airportLon(airport)],
        {
            pane:"markerPane",
            icon:icon,
            zIndexOffset:3000
        }
    ).addTo(markerLayer);

    // Airport name appears only for the airports selected in the route.
    marker.bindTooltip(
        label,
        {
            permanent:true,
            direction:"right",
            offset:[9,0],
            className:"airport-label",
            opacity:0.98
        }
    );

    marker.bindPopup(
        "<strong>"+escapeHtml(name)+"</strong><br>"+
        escapeHtml(code)+
        (city ? "<br>"+escapeHtml(city) : "")+
        (country ? "<br>"+escapeHtml(country) : "")
    );
}

function updateResult(from,to,distanceKm){
    const fromCity = from.municipality || from.city || from.locality || "";
    const toCity = to.municipality || to.city || to.locality || "";

    const fromCountry = from.country || "";
    const toCountry = to.country || "";

    const info =
        '<div class="airport-row">' +
            '<div class="airport-type">FROM</div>' +
            '<div class="airport-details">' +
                '<strong>' + escapeHtml(airportCode(from)) + ' — ' +
                escapeHtml(airportName(from)) + '</strong><br>' +
                escapeHtml(fromCity) +
                (fromCountry ? ', ' + escapeHtml(fromCountry) : '') +
            '</div>' +
        '</div>' +

        '<div class="airport-row">' +
            '<div class="airport-type">TO</div>' +
            '<div class="airport-details">' +
                '<strong>' + escapeHtml(airportCode(to)) + ' — ' +
                escapeHtml(airportName(to)) + '</strong><br>' +
                escapeHtml(toCity) +
                (toCountry ? ', ' + escapeHtml(toCountry) : '') +
            '</div>' +
        '</div>' +

        '<div class="route-distance">' +
            'Route Distance: <strong>' +
            Math.round(distanceKm).toLocaleString() +
            ' km</strong>' +
        '</div>';

    const result = document.getElementById("airportInfo");

    if(result){
        result.innerHTML = info;
    }
}

function formatMinutes(minutes){
    if(!minutes||minutes<.5)return"0 min";
    if(minutes<60)return Math.round(minutes)+" min";

    const h=Math.floor(minutes/60);
    const m=Math.round(minutes%60);

    return m===0?h+"h":h+"h "+m+"m";
}

async function copyEmail(){
    if(!currentEmail){
        showError("Run a route analysis first.");
        return;
    }

    try{
        await navigator.clipboard.writeText(currentEmail);
        const b=document.querySelector(".copy-btn");
        const old=b.textContent;
        b.textContent="COPIED";
        setTimeout(()=>b.textContent=old,1500);
    }catch(err){
        showError("Could not copy the statement.");
    }
}

function showError(message){
    const e=document.getElementById("error");
    e.textContent=message;
    e.style.display="block";
}

function clearError(){
    const e=document.getElementById("error");
    e.textContent="";
    e.style.display="none";
}

window.addEventListener("resize",()=>{
    if(map)setTimeout(()=>map.invalidateSize(true),100);
});

loadData();
</script>
</body>
</html>
