<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airport Route Checker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:#07111f;
    color:#edf4ff;
}

body{overflow:hidden}

.app{
    width:100%;
    height:100vh;
}

/* HEADER */

.header{display:none !important;}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:linear-gradient(145deg,#123967,#0c2746);
    color:#63a8ff;
    font-size:16px;
    box-shadow:inset 0 0 0 1px rgba(99,168,255,.18);
}

h1{
    margin:0;
    font-size:16px;
    font-weight:700;
    letter-spacing:.2px;
}

.subtitle{
    margin-top:2px;
    color:#71849b;
    font-size:10px;
}

.status{
    padding:6px 11px;
    border:1px solid rgba(64,205,137,.3);
    border-radius:18px;
    background:rgba(16,55,39,.65);
    color:#64dfa0;
    font-size:9px;
    font-weight:750;
    letter-spacing:.7px;
}

/* WORKSPACE */

.workspace{
    position:relative;
    width:100%;
    height:100vh !important;
    min-height:0;
    overflow:hidden;
}

#map{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    min-height:0 !important;
    z-index:1 !important;
}

/* TOP ROUTE PANEL */

.controls{
    position:absolute;
    top:74px;
    left:50%;
    transform:translateX(-50%);
    width:min(760px,calc(100% - 32px));
    z-index:1500;
    padding:12px 14px;
    background:rgba(10,23,39,.94);
    border:1px solid rgba(120,155,195,.25);
    border-radius:12px;
    box-shadow:0 10px 35px rgba(0,0,0,.42);
    backdrop-filter:blur(14px);
}

.controls-title{
    margin:0 0 8px 2px;
    color:#91a7c1;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.mode-row{
    display:none;
}

.control-row{
    display:flex;
    align-items:center;
    gap:8px;
}

.control{
    flex:1;
    min-width:0;
}

.control input{
    width:100%;
    height:38px;
    padding:0 12px;
    border:1px solid #2b4058;
    border-radius:7px;
    outline:none;
    background:#0c1a2b;
    color:#eef5ff;
    font-size:12px;
    font-weight:650;
    transition:.15s;
}

.control input::placeholder{
    color:#637991;
}

.control input:focus{
    border-color:#3f8cff;
    box-shadow:0 0 0 2px rgba(63,140,255,.12);
}

#speed{
    max-width:120px;
}

.check-btn,
.clear-btn{
    height:38px;
    padding:0 14px;
    border-radius:7px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.4px;
    cursor:pointer;
    white-space:nowrap;
    transition:.15s;
}

.check-btn{
    border:1px solid #277eea;
    background:#1769d2;
    color:#fff;
}

.check-btn:hover{
    background:#2582ed;
    transform:translateY(-1px);
}

.clear-btn{
    border:1px solid #334b66;
    background:#142438;
    color:#b9c8d9;
}

.clear-btn:hover{
    background:#1b3048;
    color:#fff;
}

.error{
    margin-top:6px;
    color:#ff8585;
    font-size:10px;
}

/* AIRPORT INFORMATION */

.map-info{
    position:absolute;
    left:20px;
    bottom:20px;
    width:min(500px,calc(100% - 40px));
    z-index:1200;
    padding:13px 15px;
    background:rgba(9,21,36,.94);
    border:1px solid rgba(120,155,195,.25);
    border-radius:11px;
    box-shadow:0 10px 32px rgba(0,0,0,.4);
    backdrop-filter:blur(12px);
}

.info-title{
    margin-bottom:9px;
    color:#849ab3;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.1px;
    text-transform:uppercase;
}

.airport-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.airport-row{
    padding:10px 11px;
    border:1px solid #263b54;
    border-radius:7px;
    background:#0d1b2c;
}

.airport-type{
    margin-bottom:4px;
    color:#579bff;
    font-size:8px;
    font-weight:800;
    letter-spacing:1px;
}

.airport-name{
    color:#edf4ff;
    font-size:12px;
    font-weight:700;
}

.airport-meta{
    margin-top:3px;
    color:#73879f;
    font-size:9px;
}

.route-distance{
    margin-top:8px;
    padding:8px 11px;
    border:1px solid #263b54;
    border-radius:7px;
    background:#0b1726;
    color:#9db1c8;
    font-size:10px;
}

.route-distance strong{
    color:#e9f2ff;
}

.airport-placeholder{
    padding:10px 11px;
    border:1px dashed #2d425b;
    border-radius:7px;
    color:#71849a;
    font-size:10px;
}

/* LEAFLET */

.leaflet-control-zoom{
    border:1px solid rgba(100,130,165,.25)!important;
    box-shadow:0 5px 18px rgba(0,0,0,.35)!important;
}

.leaflet-control-zoom a{
    background:#0d1b2c!important;
    color:#bcd0e5!important;
    border-color:#263b54!important;
}

.leaflet-control-zoom a:hover{
    background:#162940!important;
    color:#fff!important;
}

/* MOBILE */

@media(max-width:700px){
    .header{
        height:52px;
        padding:0 12px;
    }

    .subtitle{
        display:none;
    }

    .status{
        font-size:8px;
        padding:5px 8px;
    }

    .controls{
        top:64px;
        width:calc(100% - 20px);
        padding:10px;
    }

    .control-row{
        flex-wrap:wrap;
    }

    .control{
        min-width:calc(50% - 4px);
    }

    #speed{
        max-width:none;
    }

    .check-btn,
    .clear-btn{
        flex:1;
    }

    .map-info{
        left:10px;
        bottom:10px;
        width:calc(100% - 20px);
    }
}
</style>


<style>
/* FINAL ROUTE MAP LAYOUT */

<body>
<header class="header">
    <div class="brand">
        <div class="brand-icon">✈</div>
        <div>
            <h1>Airport Route Checker</h1>
            <p>Flight Route • Jamming • Spoofing Investigation</p>
        </div>
    </div>
    <div class="status">● ROUTE CHECKER READY</div>
</header>

<div class="workspace">
    <div id="map"></div>

    <div class="controls">
        <div class="controls-title">Route Check</div>
        <div class="mode-row">
        </div>
        <div class="control-row">
            <div class="control"><input id="from" value="COK" placeholder="FROM: IATA / ICAO"></div>
            <div class="control"><input id="to" value="RUH" placeholder="TO: IATA / ICAO"></div>

            <button class="check-btn" onclick="checkRoute()">CHECK ROUTE</button>
            <button class="clear-btn" onclick="clearRoute()">CLEAR ROUTE</button>
        </div>
        <div id="error" class="error"></div>
    </div>

    <div class="map-info">
        <div class="info-title">Airport Information</div>

        <div class="airport-info" id="airportInfo">
            <div class="airport-placeholder">
                Select FROM and TO airports, then click <strong>CHECK ROUTE</strong>.
            </div>
        </div>
    </div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

<script>
let airports=[],gpsjam=[],firs=[],easaCodes=[],countries=[];
let gpsjamByHex=new Map();
let map,worldLayer,worldLabelLayer,routeLayer,markerLayer;
let currentEmail="";
let currentMode="history";

let liveTimer=null;
let liveLastUpdated=null;

const DATA={
    airports:"data/airports.json",
    firs:"data/firs.geojson",
    easa:"data/easa-spoofing.json",
    countries:"data/countries.geojson"
};

async function loadData(){
    try{
        const [a,f,e,c]=await Promise.all([
            fetch(DATA.airports),fetch(DATA.firs),
            fetch(DATA.easa),fetch(DATA.countries)
        ]);

        if(!a.ok)throw new Error("Could not load airports.json");
        if(!f.ok)throw new Error("Could not load FIR data");
        if(!e.ok)throw new Error("Could not load EASA data");
        if(!c.ok)throw new Error("Could not load countries.geojson");

        airports=await a.json();
        firs=await f.json();
        easaCodes=await e.json();
        countries=await c.json();

        initializeMap();
    }catch(err){
        console.error(err);
        showError("Data loading failed: "+err.message);
        document.querySelector(".status").textContent="● DATA ERROR";
    }
}


function initializeMap(){
    map=L.map("map",{
        minZoom:2,maxZoom:8,worldCopyJump:false,
        maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1,
        zoomControl:true
    });

    map.createPane("worldPane");
    map.getPane("worldPane").style.zIndex=200;

    map.createPane("gpsPane");
    map.getPane("gpsPane").style.zIndex=400;

    map.createPane("routePane");
    map.getPane("routePane").style.zIndex=500;

    map.createPane("markerPane");
    map.getPane("markerPane").style.zIndex=600;

    map.createPane("labelPane");
    map.getPane("labelPane").style.zIndex=650;

    map.setView([20,50],3);

    /*
     * Local Natural Earth country boundaries.
     * EASA FIR polygons are intentionally NOT drawn globally.
     * They are only used to classify the selected route.
     * This prevents airspace boundaries from appearing as
     * large purple shapes over the map.
     */
    worldLayer=L.geoJSON(countries,{
        pane:"worldPane",
        style:()=>({
            color:"#9aa9b8",
            weight:1,
            opacity:1,
            fillColor:"#e9eef3",
            fillOpacity:1
        }),
        onEachFeature:(feature,layer)=>{
            const p=feature.properties||{};
            const name=p.NAME||p.ADMIN||p.NAME_LONG||p.name||"";
            if(name)layer.bindTooltip(name,{
                sticky:true,direction:"top",className:"map-label"
            });
        }
    }).addTo(map);

    // Create all overlay groups BEFORE drawing any data.
    // Permanent country names for a more presentable aviation-style map.
    // Labels are separate from the country polygons and disappear when zoomed out too far.
    worldLabelLayer=L.layerGroup().addTo(map);

    countries.features.forEach(feature=>{
        const p=feature.properties||{};
        const name=p.NAME||p.ADMIN||p.NAME_LONG||p.name||"";
        if(!name)return;

        try{
            const temp=L.geoJSON(feature);
            const center=temp.getBounds().getCenter();

            L.marker(center,{
                interactive:false,
                icon:L.divIcon({
                    className:"country-name",
                    html:escapeHtml(name),
                    iconSize:null,
                    iconAnchor:[0,0]
                })
            }).addTo(worldLabelLayer);
        }catch(err){}
    });

    routeLayer=L.layerGroup().addTo(map);
    markerLayer=L.layerGroup().addTo(map);

    map.on("zoomend",updateCountryLabels);
    updateCountryLabels();

    // Airports are intentionally NOT drawn globally.
    // Only FROM and TO airports are displayed after route analysis.
    // Do not load a hard-coded historical dataset here.

    setTimeout(()=>{
        map.invalidateSize(true);
        console.log("World features:", worldLayer.getLayers().length);
    },200);
}

function drawBlueRouteOnly(from,to){
    routeLayer.clearLayers();
    const a=[airportLat(from),airportLon(from)];
    const b=[airportLat(to),airportLon(to)];
    L.polyline([a,b],{
        pane:"routePane",color:"#1261c9",weight:5,opacity:1,interactive:false
    }).addTo(routeLayer);
    markerLayer.clearLayers();
    addAirportMarker(from);
    addAirportMarker(to);
}

function clearRoute(){
    if(routeLayer)routeLayer.clearLayers();
    if(markerLayer)markerLayer.clearLayers();

    const result=document.getElementById("routeResult");
    if(result){
        result.innerHTML='Select FROM and TO airports, then click <strong>CHECK ROUTE</strong>.';
        result.dataset.routeChecked="false";
    }

    const error=document.getElementById("error");
    if(error)error.innerHTML="";

    const status=document.querySelector(".status");
    if(status)status.textContent="● ROUTE CHECKER READY";
}

function updateCountryLabels(){
    if(!worldLabelLayer || !map)return;

    const zoom=map.getZoom();

    worldLabelLayer.eachLayer(layer=>{
        const el=layer.getElement();
        if(!el)return;

        // Keep the world view clean; show names from zoom 3 onward.
        el.style.display=zoom>=3?"block":"none";
        el.style.fontSize=zoom>=5?"10px":"9px";
    });
}

function findAirport(value){
    const s=String(value||"").trim().toUpperCase();
    return airports.find(a=>{
        const iata=String(a.iata_code||a.iata||"").trim().toUpperCase();
        const icao=String(a.ident||a.icao_code||a.icao||"").trim().toUpperCase();
        return iata===s||icao===s;
    })||null;
}

function airportLat(a){return Number(a.latitude_deg??a.latitude??a.lat)}
function airportLon(a){return Number(a.longitude_deg??a.longitude??a.lon??a.lng)}
function airportName(a){return a.name||a.airport_name||a.ident||"Airport"}
function airportCode(a){return a.iata_code||a.iata||a.ident||a.icao_code||a.icao||""}


function checkRoute(){
    clearError();

    const from=findAirport(document.getElementById("from").value);
    const to=findAirport(document.getElementById("to").value);

    if(!from){
        showError("Origin airport not found.");
        return;
    }

    if(!to){
        showError("Destination airport not found.");
        return;
    }

    analyzeRoute(from,to);
}

function analyzeRoute(from,to){
    routeLayer.clearLayers();
    markerLayer.clearLayers();

    const fromLat=airportLat(from);
    const fromLon=airportLon(from);
    const toLat=airportLat(to);
    const toLon=airportLon(to);

    const route=turf.lineString([
        [fromLon,fromLat],
        [toLon,toLat]
    ]);

    const distanceKm=turf.length(route,{units:"kilometers"});

    // Draw the airport-to-airport route.
    L.polyline(
        [[fromLat,fromLon],[toLat,toLon]],
        {
            pane:"routePane",
            color:"#2488ff",
            weight:5,
            opacity:1,
            interactive:false
        }
    ).addTo(routeLayer);

    addAirportMarker(from);
    addAirportMarker(to);

    map.fitBounds(
        [[fromLat,fromLon],[toLat,toLon]],
        {padding:[80,80],maxZoom:6}
    );

    updateResult(from,to,distanceKm);

    document.querySelector(".status").textContent="● ROUTE READY";

    setTimeout(()=>map.invalidateSize(true),250);
}

function escapeHtml(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/\"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function addAirportMarker(airport){

    const code=airportCode(airport);

    const city=
        airport.municipality ||
        airport.city ||
        airport.locality ||
        "";

    const country=
        airport.iso_country ||
        airport.country_code ||
        "";

    const name=airportName(airport);

    const label =
        code +
        (city ? " • " + city : "");

    const icon=L.divIcon({
        className:"",
        html:'<div class="airport-marker"></div>',
        iconSize:[14,14],
        iconAnchor:[7,7]
    });

    const marker=L.marker(
        [airportLat(airport),airportLon(airport)],
        {
            pane:"markerPane",
            icon:icon,
            zIndexOffset:3000
        }
    ).addTo(markerLayer);

    // Airport name appears only for the airports selected in the route.
    marker.bindTooltip(
        label,
        {
            permanent:true,
            direction:"right",
            offset:[9,0],
            className:"airport-label",
            opacity:0.98
        }
    );

    marker.bindPopup(
        "<strong>"+escapeHtml(name)+"</strong><br>"+
        escapeHtml(code)+
        (city ? "<br>"+escapeHtml(city) : "")+
        (country ? "<br>"+escapeHtml(country) : "")
    );
}

function updateResult(from,to,distanceKm){
    const fromCity = from.municipality || from.city || from.locality || "";
    const toCity = to.municipality || to.city || to.locality || "";

    const fromCountry = from.country || "";
    const toCountry = to.country || "";

    const info =
        '<div class="airport-row">' +
            '<div class="airport-type">FROM</div>' +
            '<div class="airport-details">' +
                '<strong>' + escapeHtml(airportCode(from)) + ' — ' +
                escapeHtml(airportName(from)) + '</strong><br>' +
                escapeHtml(fromCity) +
                (fromCountry ? ', ' + escapeHtml(fromCountry) : '') +
            '</div>' +
        '</div>' +

        '<div class="airport-row">' +
            '<div class="airport-type">TO</div>' +
            '<div class="airport-details">' +
                '<strong>' + escapeHtml(airportCode(to)) + ' — ' +
                escapeHtml(airportName(to)) + '</strong><br>' +
                escapeHtml(toCity) +
                (toCountry ? ', ' + escapeHtml(toCountry) : '') +
            '</div>' +
        '</div>' +

        '<div class="route-distance">' +
            'Route Distance: <strong>' +
            Math.round(distanceKm).toLocaleString() +
            ' km</strong>' +
        '</div>';

    const result = document.getElementById("airportInfo");

    if(result){
        result.innerHTML = info;
    }
}

function formatMinutes(minutes){
    if(!minutes||minutes<.5)return"0 min";
    if(minutes<60)return Math.round(minutes)+" min";

    const h=Math.floor(minutes/60);
    const m=Math.round(minutes%60);

    return m===0?h+"h":h+"h "+m+"m";
}

async function copyEmail(){
    if(!currentEmail){
        showError("Run a route analysis first.");
        return;
    }

    try{
        await navigator.clipboard.writeText(currentEmail);
        const b=document.querySelector(".copy-btn");
        const old=b.textContent;
        b.textContent="COPIED";
        setTimeout(()=>b.textContent=old,1500);
    }catch(err){
        showError("Could not copy the statement.");
    }
}

function showError(message){
    const e=document.getElementById("error");
    e.textContent=message;
    e.style.display="block";
}

function clearError(){
    const e=document.getElementById("error");
    e.textContent="";
    e.style.display="none";
}

window.addEventListener("resize",()=>{
    if(map)setTimeout(()=>map.invalidateSize(true),100);
});

loadData();
</script>
</body>
</html>
